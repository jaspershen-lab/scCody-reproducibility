[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sccody-analyses"
version = "0.1.0"
description = "Workflows, comparators and figure code for the scCody manuscript"
requires-python = ">=3.10"
dependencies = [
  "sccody>=0.1.0",
  "pandas>=2.1",
  "torchdiffeq==0.2.5",
  "threadpoolctl>=3",
  "h5py>=3",
  "joblib>=1",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "statsmodels>=0.14",
  "scanpy>=1.10",
  "numba>=0.59",
  "scikit-misc>=0.3",
  "gseapy>=1",
]

[tool.setuptools.packages.find]
include = ["sccody_analyses*"]

[tool.setuptools.package-data]
"sccody_analyses.benchmarks" = ["vendor/artemis/*.py", "vendor/artemis/LICENSE", "vendor/artemis/NOTICE"]
